name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag yang akan dirilis, contoh: v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git rev-parse "${{ env.RELEASE_TAG }}" >/dev/null
          [[ "${{ env.RELEASE_TAG }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${RELEASE_TAG}"

          # Extract changelog section for this version
          awk "/^## \[${VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > /tmp/release-notes.md

          # If empty, use a default message
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release ${VERSION}" > /tmp/release-notes.md
          fi

          echo "--- Release notes ---"
          cat /tmp/release-notes.md

      - name: Package release artifact
        id: package
        run: |
          ARTIFACT_NAME="clockify-telegram-bot-${RELEASE_TAG}.zip"
          rm -f "$ARTIFACT_NAME"
          zip -r "$ARTIFACT_NAME" . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'node_modules/*' \
            -x '.pi/*' \
            -x '.env' \
            -x '.env.*' \
            -x '*.log' \
            -x '.clasp.json' \
            -x 'appsscript.json'
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --title "${RELEASE_TAG}" \
            --notes-file /tmp/release-notes.md \
            ${{ steps.package.outputs.artifact_name }}
