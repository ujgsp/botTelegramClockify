name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag yang akan dirilis, contoh: v1.0.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git rev-parse "${{ github.event.inputs.tag }}" >/dev/null
          [[ "${{ github.event.inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate clasp config exists
        run: |
          echo "✅ Source files ready for GAS deployment"
          ls -la *.gs *.js 2>/dev/null || true

      - name: Package release artifact
        id: package
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ARTIFACT_NAME="clockify-telegram-bot-${RELEASE_TAG}.zip"
          rm -f "$ARTIFACT_NAME"
          zip -r "$ARTIFACT_NAME" . \
            -x '.git/*' \
            -x '.github/*' \
            -x 'node_modules/*' \
            -x '.pi/*' \
            -x '.env' \
            -x '.env.*' \
            -x '*.log' \
            -x '.clasp.json' \
            -x 'appsscript.json'
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Clockify Telegram Bot ${{ github.event.inputs.tag || github.ref_name }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: ${{ steps.package.outputs.artifact_name }}
